<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outpatients - HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2><span>+</span> HMS</h2><small>Hospital Management System</small></div>
    <ul class="nav-list">
      <li><a href="index.html"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li><a href="patients.html" class="active"><i class="bi bi-person-plus"></i> Outpatients</a></li>
      <li><a href="inpatients.html"><i class="bi bi-hospital"></i> Inpatients</a></li>
      <li><a href="doctors.html"><i class="bi bi-person-badge"></i> Doctors</a></li>
      <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
      <li><a href="allocations.html"><i class="bi bi-door-open"></i> Allocations</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
    </ul>
  </aside>

  <div class="main-content">
    <div class="top-bar">
      <div><button class="mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button><h1>Outpatients<small>Manage outpatient records</small></h1></div>
    </div>

    <div id="alertMessage"></div>

    <div class="card">
      <div class="card-header">
        <h3>All Outpatients</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search by name or ID..." style="width:200px;" oninput="searchPatients()">
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#patientModal" onclick="openAddPatient()"><i class="bi bi-plus-lg"></i> Add Patient</button>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table" id="patientsTable">
            <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Age</th><th>Gender</th><th>Specialist</th><th>History</th><th>Actions</th></tr></thead>
            <tbody id="patientsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="patientModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Outpatient</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="patientForm" onsubmit="return savePatient(event)">
          <div class="modal-body">
            <input type="hidden" id="editPatientId">
            <div class="mb-3"><label class="form-label">Patient Name</label><input type="text" class="form-control" id="pName" required></div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">Phone Number</label><input type="number" class="form-control" id="pPhone" required></div>
              <div class="col-md-3 mb-3"><label class="form-label">Age</label><input type="number" class="form-control" id="pAge" min="0" max="150" required></div>
              <div class="col-md-3 mb-3"><label class="form-label">Gender</label><select class="form-select" id="pGender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>
            </div>
            <div class="mb-3"><label class="form-label">Specialist Needed</label><input type="text" class="form-control" id="pSpecialist" placeholder="e.g. Cardiology"></div>
            <div class="mb-3"><label class="form-label">Medical History</label><textarea class="form-control" id="pHistory" rows="2"></textarea></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let patients = [];
    let patientModalInstance = null;

    async function loadPatients() {
      const body = document.getElementById('patientsBody');
      showLoading(body);
      try {
        patients = await api.getOutpatients();
        renderPatients(patients);
      } catch (e) {
        loadMockPatients();
      }
    }

    function renderPatients(data) {
      const body = document.getElementById('patientsBody');
      if (!data || data.length === 0) { showEmpty(body, 'No outpatients found'); return; }
      body.innerHTML = data.map(p =>
        `<tr>
          <td><strong>${p.patientId}</strong></td>
          <td>${p.patientName}</td>
          <td>${p.phNo || p.phoneNumber}</td>
          <td>${p.age}</td>
          <td>${p.gender}</td>
          <td>${p.specialisation || p.specialist || '-'}</td>
          <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${p.medicalHistory || ''}">${p.medicalHistory || '-'}</td>
          <td>
            <div class="action-group">
              <button class="btn btn-outline-primary btn-sm" onclick="editPatient('${p.patientId}')" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" onclick="deletePatient('${p.patientId}')" title="Delete"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>`
      ).join('');
    }

    function searchPatients() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      if (!q) { renderPatients(patients); return; }
      const filtered = patients.filter(p =>
        p.patientId.toLowerCase().includes(q) || p.patientName.toLowerCase().includes(q)
      );
      renderPatients(filtered);
    }

    function openAddPatient() {
      document.getElementById('modalTitle').textContent = 'Add Outpatient';
      document.getElementById('saveBtn').textContent = 'Save';
      document.getElementById('patientForm').reset();
      document.getElementById('editPatientId').value = '';
    }

    async function editPatient(id) {
      const p = patients.find(x => x.patientId === id);
      if (!p) return;
      document.getElementById('modalTitle').textContent = 'Edit Outpatient';
      document.getElementById('saveBtn').textContent = 'Update';
      document.getElementById('editPatientId').value = id;
      document.getElementById('pName').value = p.patientName;
      document.getElementById('pPhone').value = p.phNo || p.phoneNumber;
      document.getElementById('pAge').value = p.age;
      document.getElementById('pGender').value = p.gender;
      document.getElementById('pSpecialist').value = p.specialisation || p.specialist || '';
      document.getElementById('pHistory').value = p.medicalHistory || '';
      new bootstrap.Modal(document.getElementById('patientModal')).show();
    }

    async function savePatient(e) {
      e.preventDefault();
      const data = {
        patientName: document.getElementById('pName').value,
        phNo: parseInt(document.getElementById('pPhone').value),
        phoneNumber: parseInt(document.getElementById('pPhone').value),
        age: parseInt(document.getElementById('pAge').value),
        gender: document.getElementById('pGender').value,
        specialist: document.getElementById('pSpecialist').value,
        specialisation: document.getElementById('pSpecialist').value,
        medicalHistory: document.getElementById('pHistory').value,
      };
      const editId = document.getElementById('editPatientId').value;
      try {
        if (editId) {
          await api.updateOutpatient(editId, data);
          showAlert('Patient updated successfully');
        } else {
          await api.addOutpatient(data);
          showAlert('Patient added successfully');
        }
        bootstrap.Modal.getInstance(document.getElementById('patientModal')).hide();
        loadPatients();
      } catch (e) {
        showAlert('Error saving patient: ' + e.message, 'danger');
      }
    }

    async function deletePatient(id) {
      if (!confirm('Delete patient ' + id + '?')) return;
      try {
        await api.deleteOutpatient(id);
        showAlert('Patient deleted successfully');
        loadPatients();
      } catch (e) {
        showAlert('Error deleting patient: ' + e.message, 'danger');
      }
    }

    /* Mock fallback */
    function loadMockPatients() {
      patients = [
        {patientId:'PT101',patientName:'Arun Kumar',phNo:9876543210,age:35,gender:'Male',specialisation:'Cardiology',medicalHistory:'Diabetes'},
        {patientId:'PT102',patientName:'Priya Devi',phNo:9876543211,age:28,gender:'Female',specialisation:'Neurology',medicalHistory:'Migraine'},
        {patientId:'PT103',patientName:'Suresh Babu',phNo:9876543212,age:45,gender:'Male',specialisation:'Orthopedics',medicalHistory:'Knee pain'},
      ];
      renderPatients(patients);
    }
  </script>
</body>
</html>
