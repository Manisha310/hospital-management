<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inpatients - HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2><span>+</span> HMS</h2><small>Hospital Management System</small></div>
    <ul class="nav-list">
      <li><a href="index.html"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li><a href="patients.html"><i class="bi bi-person-plus"></i> Outpatients</a></li>
      <li><a href="inpatients.html" class="active"><i class="bi bi-hospital"></i> Inpatients</a></li>
      <li><a href="doctors.html"><i class="bi bi-person-badge"></i> Doctors</a></li>
      <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
      <li><a href="allocations.html"><i class="bi bi-door-open"></i> Allocations</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
    </ul>
  </aside>

  <div class="main-content">
    <div class="top-bar">
      <div><button class="mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button><h1>Inpatients<small>Manage inpatient records</small></h1></div>
    </div>

    <div id="alertMessage"></div>

    <div class="card">
      <div class="card-header">
        <h3>All Inpatients</h3>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#ipModal" onclick="openAddInpatient()"><i class="bi bi-plus-lg"></i> Add Inpatient</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table" id="ipTable">
            <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Age</th><th>Gender</th><th>Treatment</th><th>Room</th><th>Food</th><th>Days</th><th>Actions</th></tr></thead>
            <tbody id="ipBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="ipModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="ipModalTitle">Add Inpatient</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="ipForm" onsubmit="return saveInpatient(event)">
          <div class="modal-body">
            <input type="hidden" id="editIpId">
            <div class="mb-3"><label class="form-label">Patient Name</label><input type="text" class="form-control" id="ipName" required></div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">Phone</label><input type="number" class="form-control" id="ipPhone" required></div>
              <div class="col-md-3 mb-3"><label class="form-label">Age</label><input type="number" class="form-control" id="ipAge" min="0" required></div>
              <div class="col-md-3 mb-3"><label class="form-label">Gender</label><select class="form-select" id="ipGender"><option>Male</option><option>Female</option><option>Other</option></select></div>
            </div>
            <div class="mb-3"><label class="form-label">Specialist</label><input type="text" class="form-control" id="ipSpecialist"></div>
            <div class="mb-3"><label class="form-label">Medical History</label><textarea class="form-control" id="ipHistory" rows="2"></textarea></div>
            <div class="mb-3"><label class="form-label">Treatment</label><input type="text" class="form-control" id="ipTreatment" required></div>
            <div class="row">
              <div class="col-md-4 mb-3"><label class="form-label">Room Type</label><select class="form-select" id="ipRoom"><option value="AC">AC</option><option value="NONAC">Non-AC</option></select></div>
              <div class="col-md-4 mb-3"><label class="form-label">Food</label><select class="form-select" id="ipFood"><option value="YES">Yes</option><option value="NO">No</option></select></div>
              <div class="col-md-4 mb-3"><label class="form-label">Days</label><input type="number" class="form-control" id="ipDays" min="1" value="1" required></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="ipSaveBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let inpatients = [];

    async function loadInpatients() {
      const body = document.getElementById('ipBody');
      showLoading(body);
      try {
        inpatients = await api.getInpatients();
        renderInpatients(inpatients);
      } catch (e) {
        loadMockInpatients();
      }
    }

    function renderInpatients(data) {
      const body = document.getElementById('ipBody');
      if (!data || data.length === 0) { showEmpty(body, 'No inpatients found'); return; }
      body.innerHTML = data.map(p =>
        `<tr>
          <td><strong>${p.patientId}</strong></td>
          <td>${p.patientName}</td>
          <td>${p.phoneNumber}</td>
          <td>${p.age}</td>
          <td>${p.gender}</td>
          <td>${p.treatment || '-'}</td>
          <td><span class="badge ${p.roomType === 'AC' ? 'badge-ac' : 'badge-nonac'}">${p.roomType || 'NONAC'}</span></td>
          <td>${p.food || 'NO'}</td>
          <td>${p.days || 0}</td>
          <td>
            <div class="action-group">
              <button class="btn btn-outline-primary btn-sm" onclick="editInpatient('${p.patientId}')"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" onclick="deleteInpatient('${p.patientId}')"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>`
      ).join('');
    }

    function openAddInpatient() {
      document.getElementById('ipModalTitle').textContent = 'Add Inpatient';
      document.getElementById('ipSaveBtn').textContent = 'Save';
      document.getElementById('ipForm').reset();
      document.getElementById('editIpId').value = '';
    }

    async function editInpatient(id) {
      const p = inpatients.find(x => x.patientId === id);
      if (!p) return;
      document.getElementById('ipModalTitle').textContent = 'Edit Inpatient';
      document.getElementById('ipSaveBtn').textContent = 'Update';
      document.getElementById('editIpId').value = id;
      document.getElementById('ipName').value = p.patientName;
      document.getElementById('ipPhone').value = p.phoneNumber;
      document.getElementById('ipAge').value = p.age;
      document.getElementById('ipGender').value = p.gender;
      document.getElementById('ipSpecialist').value = p.specialist || '';
      document.getElementById('ipHistory').value = p.medicalHistory || '';
      document.getElementById('ipTreatment').value = p.treatment || '';
      document.getElementById('ipRoom').value = p.roomType || 'NONAC';
      document.getElementById('ipFood').value = p.food || 'NO';
      document.getElementById('ipDays').value = p.days || 1;
      new bootstrap.Modal(document.getElementById('ipModal')).show();
    }

    async function saveInpatient(e) {
      e.preventDefault();
      const data = {
        patientName: document.getElementById('ipName').value,
        phoneNumber: parseInt(document.getElementById('ipPhone').value),
        age: parseInt(document.getElementById('ipAge').value),
        gender: document.getElementById('ipGender').value,
        specialist: document.getElementById('ipSpecialist').value,
        medicalHistory: document.getElementById('ipHistory').value,
        treatment: document.getElementById('ipTreatment').value,
        roomType: document.getElementById('ipRoom').value,
        food: document.getElementById('ipFood').value,
        days: parseInt(document.getElementById('ipDays').value),
      };
      const editId = document.getElementById('editIpId').value;
      try {
        if (editId) {
          await api.updateInpatient(editId, data);
          showAlert('Inpatient updated');
        } else {
          await api.addInpatient(data);
          showAlert('Inpatient added');
        }
        bootstrap.Modal.getInstance(document.getElementById('ipModal')).hide();
        loadInpatients();
      } catch (e) {
        showAlert('Error: ' + e.message, 'danger');
      }
    }

    async function deleteInpatient(id) {
      if (!confirm('Delete inpatient ' + id + '?')) return;
      try {
        await api.deleteInpatient(id);
        showAlert('Inpatient deleted');
        loadInpatients();
      } catch (e) {
        showAlert('Error: ' + e.message, 'danger');
      }
    }

    function loadMockInpatients() {
      inpatients = [
        {patientId:'IP201',patientName:'Ravi Shankar',phoneNumber:9876543220,age:55,gender:'Male',specialist:'Cardiology',medicalHistory:'Heart condition',treatment:'Angioplasty',roomType:'AC',food:'YES',days:5},
        {patientId:'IP202',patientName:'Lakshmi Narayanan',phoneNumber:9876543221,age:42,gender:'Female',specialist:'Neurology',medicalHistory:'Stroke',treatment:'Therapy',roomType:'NONAC',food:'YES',days:3},
      ];
      renderInpatients(inpatients);
    }
  </script>
</body>
</html>
