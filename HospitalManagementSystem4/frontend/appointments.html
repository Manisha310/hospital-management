<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2><span>+</span> HMS</h2><small>Hospital Management System</small></div>
    <ul class="nav-list">
      <li><a href="index.html"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li><a href="patients.html"><i class="bi bi-person-plus"></i> Outpatients</a></li>
      <li><a href="inpatients.html"><i class="bi bi-hospital"></i> Inpatients</a></li>
      <li><a href="doctors.html"><i class="bi bi-person-badge"></i> Doctors</a></li>
      <li><a href="appointments.html" class="active"><i class="bi bi-calendar-check"></i> Appointments</a></li>
      <li><a href="allocations.html"><i class="bi bi-door-open"></i> Allocations</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
    </ul>
  </aside>

  <div class="main-content">
    <div class="top-bar">
      <div><button class="mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button><h1>Appointments<small>Manage patient appointments</small></h1></div>
    </div>

    <div id="alertMessage"></div>

    <div class="card">
      <div class="card-header">
        <h3>All Appointments</h3>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#aptModal" onclick="openAddAppointment()"><i class="bi bi-plus-lg"></i> Add Appointment</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table" id="aptTable">
            <thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Specialist</th><th>Date</th><th>Time</th><th>Actions</th></tr></thead>
            <tbody id="aptBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="aptModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="aptModalTitle">Add Appointment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="aptForm" onsubmit="return saveAppointment(event)">
          <div class="modal-body">
            <input type="hidden" id="editAptId">
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">Patient ID</label>
                <select class="form-select" id="aptPatient" required><option value="">-- Select --</option></select>
              </div>
              <div class="col-md-6 mb-3"><label class="form-label">Doctor ID</label>
                <select class="form-select" id="aptDoctor" required><option value="">-- Select --</option></select>
              </div>
            </div>
            <div class="mb-3"><label class="form-label">Specialist</label><input type="text" class="form-control" id="aptSpecialist" placeholder="Auto-filled or enter manually"></div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">Appointment Date</label><input type="date" class="form-control" id="aptDate" required></div>
              <div class="col-md-6 mb-3"><label class="form-label">Appointment Time</label><input type="time" class="form-control" id="aptTime" required></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="aptSaveBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let appointments = [];
    let aptPatients = [];
    let aptDoctors = [];

    async function loadAppointments() {
      const body = document.getElementById('aptBody');
      showLoading(body);
      try {
        appointments = await api.getAppointments();
        aptPatients = await api.getOutpatients();
        aptDoctors = await api.getDoctors();
        renderAppointments(appointments);
        populateSelect('aptPatient', aptPatients, 'patientId', 'patientName');
        populateSelect('aptDoctor', aptDoctors, 'doctorId', 'doctorName');
      } catch (e) {
        loadMockAppointments();
      }
    }

    function renderAppointments(data) {
      const body = document.getElementById('aptBody');
      if (!data || data.length === 0) { showEmpty(body, 'No appointments found'); return; }
      body.innerHTML = data.map(a =>
        `<tr>
          <td><strong>${a.appointmentId}</strong></td>
          <td>${a.patientId}</td>
          <td>${a.doctorId}</td>
          <td>${a.specialist || '-'}</td>
          <td>${formatDate(a.appointmentDate)}</td>
          <td>${a.appointmentTime || '-'}</td>
          <td>
            <div class="action-group">
              <button class="btn btn-outline-primary btn-sm" onclick="editAppointment('${a.appointmentId}')"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" onclick="deleteAppointment('${a.appointmentId}')"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>`
      ).join('');
    }

    function openAddAppointment() {
      document.getElementById('aptModalTitle').textContent = 'Add Appointment';
      document.getElementById('aptSaveBtn').textContent = 'Save';
      document.getElementById('aptForm').reset();
      document.getElementById('editAptId').value = '';
    }

    async function editAppointment(id) {
      const a = appointments.find(x => x.appointmentId === id);
      if (!a) return;
      document.getElementById('aptModalTitle').textContent = 'Edit Appointment';
      document.getElementById('aptSaveBtn').textContent = 'Update';
      document.getElementById('editAptId').value = id;
      document.getElementById('aptPatient').value = a.patientId;
      document.getElementById('aptDoctor').value = a.doctorId;
      document.getElementById('aptSpecialist').value = a.specialist || '';
      document.getElementById('aptDate').value = a.appointmentDate || '';
      document.getElementById('aptTime').value = a.appointmentTime || '';
      new bootstrap.Modal(document.getElementById('aptModal')).show();
    }

    async function saveAppointment(e) {
      e.preventDefault();
      const data = {
        patientId: document.getElementById('aptPatient').value,
        doctorId: document.getElementById('aptDoctor').value,
        specialist: document.getElementById('aptSpecialist').value,
        appointmentDate: document.getElementById('aptDate').value,
        appointmentTime: document.getElementById('aptTime').value,
      };
      const editId = document.getElementById('editAptId').value;
      try {
        if (editId) {
          await api.updateAppointment(editId, data);
          showAlert('Appointment updated');
        } else {
          await api.addAppointment(data);
          showAlert('Appointment added');
        }
        bootstrap.Modal.getInstance(document.getElementById('aptModal')).hide();
        loadAppointments();
      } catch (e) {
        showAlert('Error: ' + e.message, 'danger');
      }
    }

    async function deleteAppointment(id) {
      if (!confirm('Delete appointment ' + id + '?')) return;
      try {
        await api.deleteAppointment(id);
        showAlert('Appointment deleted');
        loadAppointments();
      } catch (e) {
        showAlert('Error: ' + e.message, 'danger');
      }
    }

    function loadMockAppointments() {
      appointments = [
        {appointmentId:'APT101',patientId:'PT101',doctorId:'DR5',specialist:'Neurology',appointmentDate:'2026-06-25',appointmentTime:'10:00'},
        {appointmentId:'APT102',patientId:'PT102',doctorId:'DR3',specialist:'Cardiology',appointmentDate:'2026-06-25',appointmentTime:'14:00'},
        {appointmentId:'APT103',patientId:'PT103',doctorId:'DR7',specialist:'Pediatrics',appointmentDate:'2026-06-26',appointmentTime:'09:00'},
      ];
      renderAppointments(appointments);
      populateSelect('aptPatient', [
        {patientId:'PT101',patientName:'Arun Kumar'},
        {patientId:'PT102',patientName:'Priya Devi'},
        {patientId:'PT103',patientName:'Suresh Babu'}
      ], 'patientId', 'patientName');
      populateSelect('aptDoctor', [
        {doctorId:'DR3',doctorName:'Dr. Priya Sharma'},
        {doctorId:'DR5',doctorName:'Dr. Rajesh Kumar'},
        {doctorId:'DR7',doctorName:'Dr. Meena Devi'}
      ], 'doctorId', 'doctorName');
    }
  </script>
</body>
</html>
