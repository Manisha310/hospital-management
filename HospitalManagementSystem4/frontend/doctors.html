<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors - HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2><span>+</span> HMS</h2><small>Hospital Management System</small></div>
    <ul class="nav-list">
      <li><a href="index.html"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li><a href="patients.html"><i class="bi bi-person-plus"></i> Outpatients</a></li>
      <li><a href="inpatients.html"><i class="bi bi-hospital"></i> Inpatients</a></li>
      <li><a href="doctors.html" class="active"><i class="bi bi-person-badge"></i> Doctors</a></li>
      <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
      <li><a href="allocations.html"><i class="bi bi-door-open"></i> Allocations</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
    </ul>
  </aside>

  <div class="main-content">
    <div class="top-bar">
      <div><button class="mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button><h1>Doctors<small>Manage doctor records</small></h1></div>
    </div>

    <div id="alertMessage"></div>

    <div class="card">
      <div class="card-header">
        <h3>All Doctors</h3>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#docModal" onclick="openAddDoctor()"><i class="bi bi-plus-lg"></i> Add Doctor</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table" id="docTable">
            <thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Available Date</th><th>Available Time</th><th>Actions</th></tr></thead>
            <tbody id="docBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="docModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="docModalTitle">Add Doctor</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="docForm" onsubmit="return saveDoctor(event)">
          <div class="modal-body">
            <input type="hidden" id="editDocId">
            <div class="mb-3"><label class="form-label">Doctor Name</label><input type="text" class="form-control" id="docName" required></div>
            <div class="mb-3"><label class="form-label">Specialization</label><input type="text" class="form-control" id="docSpec" placeholder="e.g. Cardiology" required></div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">Available Date</label><input type="date" class="form-control" id="docDate" required></div>
              <div class="col-md-6 mb-3"><label class="form-label">Available Time</label><input type="time" class="form-control" id="docTime" required></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="docSaveBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let doctors = [];

    async function loadDoctors() {
      const body = document.getElementById('docBody');
      showLoading(body);
      try {
        doctors = await api.getDoctors();
        renderDoctors(doctors);
      } catch (e) {
        loadMockDoctors();
      }
    }

    function renderDoctors(data) {
      const body = document.getElementById('docBody');
      if (!data || data.length === 0) { showEmpty(body, 'No doctors found'); return; }
      body.innerHTML = data.map(d =>
        `<tr>
          <td><strong>${d.doctorId}</strong></td>
          <td>${d.doctorName}</td>
          <td><span class="badge bg-primary-subtle text-primary">${d.specialization}</span></td>
          <td>${formatDate(d.availableDate)}</td>
          <td>${d.availableTime || '-'}</td>
          <td>
            <div class="action-group">
              <button class="btn btn-outline-primary btn-sm" onclick="editDoctor('${d.doctorId}')"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" onclick="deleteDoctor('${d.doctorId}')"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>`
      ).join('');
    }

    function openAddDoctor() {
      document.getElementById('docModalTitle').textContent = 'Add Doctor';
      document.getElementById('docSaveBtn').textContent = 'Save';
      document.getElementById('docForm').reset();
      document.getElementById('editDocId').value = '';
    }

    async function editDoctor(id) {
      const d = doctors.find(x => x.doctorId === id);
      if (!d) return;
      document.getElementById('docModalTitle').textContent = 'Edit Doctor';
      document.getElementById('docSaveBtn').textContent = 'Update';
      document.getElementById('editDocId').value = id;
      document.getElementById('docName').value = d.doctorName;
      document.getElementById('docSpec').value = d.specialization;
      document.getElementById('docDate').value = d.availableDate || '';
      document.getElementById('docTime').value = d.availableTime || '';
      new bootstrap.Modal(document.getElementById('docModal')).show();
    }

    async function saveDoctor(e) {
      e.preventDefault();
      const data = {
        doctorName: document.getElementById('docName').value,
        specialization: document.getElementById('docSpec').value,
        availableDate: document.getElementById('docDate').value,
        availableTime: document.getElementById('docTime').value,
      };
      const editId = document.getElementById('editDocId').value;
      try {
        if (editId) {
          await api.updateDoctor(editId, data);
          showAlert('Doctor updated');
        } else {
          await api.addDoctor(data);
          showAlert('Doctor added');
        }
        bootstrap.Modal.getInstance(document.getElementById('docModal')).hide();
        loadDoctors();
      } catch (e) {
        showAlert('Error: ' + e.message, 'danger');
      }
    }

    async function deleteDoctor(id) {
      if (!confirm('Delete doctor ' + id + '?')) return;
      try {
        await api.deleteDoctor(id);
        showAlert('Doctor deleted');
        loadDoctors();
      } catch (e) {
        showAlert('Error: ' + e.message, 'danger');
      }
    }

    function loadMockDoctors() {
      doctors = [
        {doctorId:'DR3',doctorName:'Dr. Priya Sharma',specialization:'Cardiology',availableDate:'2026-06-25',availableTime:'10:00'},
        {doctorId:'DR5',doctorName:'Dr. Rajesh Kumar',specialization:'Neurology',availableDate:'2026-06-24',availableTime:'14:00'},
        {doctorId:'DR7',doctorName:'Dr. Meena Devi',specialization:'Pediatrics',availableDate:'2026-06-26',availableTime:'09:00'},
        {doctorId:'DR9',doctorName:'Dr. Senthil Nathan',specialization:'Orthopedics',availableDate:'2026-06-27',availableTime:'11:00'},
      ];
      renderDoctors(doctors);
    }
  </script>
</body>
</html>
